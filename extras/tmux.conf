# ─────────────────────────────────────────────────────────────────────────────
#  Da Vinci Console — tmux.conf
#
#  A shareable tmux config that turns your status line into a herdr-style
#  "which agents are working right now?" dashboard and binds the Da Vinci
#  Console session picker.
#
#  Depends on the scripts installed by ./install.sh to:
#    ~/.config/tmux/agents/           (agent detection: window_agent.sh ...)
#    ~/.config/tmux/sesh_picker.sh    (Da Vinci Console session picker)
#
#  Usage:
#    1. ./install.sh
#    2. cp extras/tmux.conf ~/.config/tmux/tmux.conf   (back up yours first)
#    3. Reload with <prefix>+r
#
#  Theme colours come from the TrustedSec palette (self-contained hex values).
# ─────────────────────────────────────────────────────────────────────────────

# ── Terminal ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g focus-events on
set -g extended-keys on

# ── General ─────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g repeat-time 400
set -g display-time 2000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# ── Prefix ──────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Status bar ──────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0a0a0a,fg=#7b8496"
set -g status-left-length 40
set -g status-right-length 80

# Left: session name
set -g status-left "#[fg=#14e21a,bg=#0a0a0a]#[fg=#000000,bg=#14e21a,bold] #S #[fg=#14e21a,bg=#0a0a0a,nobold]#[default] "

# Right: git branch · pane count · date/time
set -g status-right "#[fg=#00422c,bg=#0a0a0a]#[fg=#e8fd2e,bg=#00422c,bold] #(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null)#(git -C #{pane_current_path} status --porcelain 2>/dev/null | grep -q . && printf ' ●') #[fg=#00422c,bg=#0a0a0a,nobold]#[default] #[fg=#333333]│ #[fg=#00422c,bg=#0a0a0a]#[fg=#edf1f3,bg=#00422c,bold] #{window_panes}p #[fg=#00422c,bg=#0a0a0a,nobold]#[default] #[fg=#14e21a,bg=#0a0a0a]#[fg=#000000,bg=#14e21a,bold] %b %d %H:%M #[fg=#14e21a,bg=#0a0a0a,nobold]#[default] "

# ── Windows: annotated with the agent running in each ───────────────────────
# window_agent.sh prints " | pi ●" (or nothing) for the window's active pane,
# so each pill shows its agent + status light. No agent → renders as before.
set -g window-status-format "#[fg=#7b8496] #I:#W#(bash ~/.config/tmux/agents/window_agent.sh #{pane_id}) "
set -g window-status-current-format "#[fg=#14e21a,bg=#0a0a0a]#[fg=#000000,bg=#14e21a,bold] #I:#W#(bash ~/.config/tmux/agents/window_agent.sh #{pane_id}) #[fg=#14e21a,bg=#0a0a0a,nobold]#[default]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#e8fd2e,bg=#0a0a0a"
set -g window-status-bell-style "fg=#ff3333,bg=#0a0a0a"
setw -g monitor-activity on
set -g visual-activity off

# Click a window pill to jump to it.
bind -n MouseDown1Status select-window -t '{mouse}'

# ── Panes ───────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#14e21a"
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-status top
set -g pane-border-format "#[fg=#1c47ff] #{pane_current_path}#(bash ~/.config/tmux/agents/window_agent.sh #{pane_id})  #(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null) "

# ── Messages & copy mode ────────────────────────────────────────────────────
set -g message-style "bg=#0a0a0a,fg=#14e21a"
set -g message-command-style "bg=#0a0a0a,fg=#1c47ff"
set -g mode-style "bg=#14e21a,fg=#000000"
set -g clock-mode-colour "#14e21a"

# ── Keybindings ─────────────────────────────────────────────────────────────
# Pane splitting (keep cwd)
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Da Vinci Console session picker (<prefix>+s)
set -g popup-border-style "fg=#14e21a"
bind-key s display-popup -B -x C -y C -w 70% -h 60% -s "bg=#0a0a0a" -E "~/.config/tmux/sesh_picker.sh"

# Jump to an agent via fzf (<prefix>+a) — optional, needs fzf
bind-key a run-shell -b "~/.config/tmux/agents/jump.sh"

# ── Optional: session persistence (needs TPM) ───────────────────────────────
# Uncomment if you use TPM. `prefix + I` installs the plugins.
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @resurrect-dir '$HOME/.local/share/tmux/resurrect'
# set -g @continuum-restore 'on'
# run '~/.config/tmux/plugins/tpm/tpm'
